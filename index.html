<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Goldie — chat with your AI creative assistant. Edit videos, make clips, captions, and ads.">
    <title>Goldie</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Sidebar">
        <div class="sidebar-top">
          <a class="brand" href="/" aria-label="Goldie home">
            <span class="brand-mark">G</span>
            <strong>Goldie</strong>
          </a>
          <button class="icon-btn" id="newChat" type="button" title="New chat">+</button>
        </div>
        <p class="sidebar-hint">Your creative AI. Just type what you want — like texting a pro editor.</p>
        <div class="tool-section">
          <span class="section-label">Quick tools</span>
          <div class="tool-chips" id="toolChips"></div>
        </div>
        <input type="file" id="videoUpload" accept="video/*" hidden>
      </aside>

      <main class="chat" id="chat">
        <header class="chat-header">
          <div>
            <h1>Chat with Goldie</h1>
            <p>Upload a video or describe what you want. I'll plan the edit, clips, captions, and visuals.</p>
          </div>
        </header>

        <div class="messages" id="messages" aria-live="polite"></div>

        <div class="composer-wrap">
          <div class="attached-file hidden" id="attachedFile" aria-live="polite"></div>
          <form class="composer" id="chatForm">
            <button class="icon-btn attach-btn" id="attachVideo" type="button" title="Attach video">📎</button>
            <textarea
              id="chatInput"
              rows="1"
              placeholder="Tell Goldie what you want… e.g. “Cut my video into TikTok clips with captions”"
              aria-label="Message Goldie"
            ></textarea>
            <button class="send-btn" id="sendBtn" type="submit" aria-label="Send">↑</button>
          </form>
          <p class="composer-note">Goldie plans your edit. Connect Luma, Runway, or Opus later to run it for real.</p>
        </div>
      </main>
    </div>

    <script src="src/goldyEngine.js"></script>
    <script src="src/skillsLoader.js"></script>
    <script src="app.js"></script>
  </body>
</html>
